name: abhaya
description: "AI-driven predictive safety ecosystem with glassmorphic design architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0

  # Animations & Styling
  flutter_animate: ^4.5.0

  # Firebase & Auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  firebase_messaging: ^15.1.3
  country_code_picker: ^3.0.0

  # Persistence & Device Features
  shared_preferences: ^2.2.3
  local_auth: ^2.2.0

  # Voice & Chat
  speech_to_text: 7.4.0

  # Phase 2 — Background Execution & Sensor Telemetry
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^17.2.3
  geolocator: ^13.0.2
  sensors_plus: ^6.1.1
  permission_handler: ^11.3.1

  # Phase 3 — Edge ML & Audio Inference
  tflite_flutter: ^0.11.0
  record: ^6.2.1
  path_provider: ^2.1.2

  # Phase 4 — Device APIs & Evidence
  battery_plus: ^6.0.3

  # Backend API Client
  http: ^1.2.2
  image_picker: ^1.1.2
  connectivity_plus: ^7.2.0

  # Map Integration
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geocoding: ^3.0.0

  # Audio & Flashlight
  audioplayers: ^6.0.0
  torch_light: ^1.0.0
  flutter_ringtone_player: ^4.0.0+3

  # Health & Sensors
  pedometer: ^4.0.0
  flutter_dotenv: ^6.0.1
  share_plus: ^13.2.0
  flutter_secure_storage: ^10.3.1
  sqflite: ^2.4.2+1
  path: ^1.9.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/ChatGPT Image Jul 15, 2026, 08_11_50 PM.png"
  min_sdk_android: 21

  # Codegen Pipelines
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/fonts/
    - assets/ml/
    - assets/sounds/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
